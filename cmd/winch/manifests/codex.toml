# codex CLI detection rules, ported from herdr's manifest. Blockers and the
# working line are scoped to codex's prompt-marker regions (after / before the
# live `›` input line, manifest.go codexPromptIndex), matching herdr exactly —
# a stale approval prompt left in scrollback above a fresh prompt no longer
# reads as a live blocker.
id = "codex"
version = "2026.08.21.1"

[[rules]]
id = "osc_title_action_required"
label = "action required"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]( |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["↑/↓ to scroll"]
any = [
  { contains = ["pgup/pgdn"] },
  { contains = ["q to quit"] },
  { contains = ["esc to edit prev"] },
]

[[rules]]
id = "trust_directory_prompt"
label = "trust prompt"
state = "blocked"
priority = 990
region = "top_non_empty_lines(20)"
visible_blocker = true
regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?']

[[rules]]
id = "strong_blockers"
label = "approval prompt"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["allow command?"] },
  { contains = ["enter to submit answer"] },
]

[[rules]]
id = "screen_working"
state = "working"
priority = 800
region = "before_current_prompt_marker"
visible_working = true
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)( · .*)?$']
not = [
  { contains = ["■ conversation interrupted"] },
]

[[rules]]
id = "weak_blockers"
label = "approval prompt"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "osc_title_idle_catchall"
# Any non-empty title that isn't a spinner frame or Action Required.
state = "idle"
priority = 100
region = "osc_title"
# Reliable positive idle: a working turn puts a spinner frame in the title
# (osc_title_working, prio 1050), so a plain title wins only when the turn is
# truly over. visible_idle lets the state machine publish it at once instead of
# holding for still frames — codex's idle prompt animates an ambient sparkle
# forever, which a still-frame hold reads as "never settled" and pins working.
visible_idle = true
regex = ['\S']
