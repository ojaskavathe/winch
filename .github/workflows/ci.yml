name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./cmd/demuxd/

  # Full integration rigs: isolated tmux servers on real ptys. -short skips
  # the big-scrollback tests; -parallel 2 because full parallel oversubscribes
  # the machine and flakes the timing tests.
  rigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: tmux -V
      - working-directory: rigs
        run: go test -count=1 -short -parallel 2 -timeout 15m .
      - name: daemon logs
        if: failure()
        run: for f in /tmp/demux-*/*.log; do echo "===== $f"; cat "$f"; done
